<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Forkline</title>
<meta name="description" content="Forkline: book a delivery slot and get dinner from local kitchens.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/core.js" defer></script>
{{scripts}}
</head>
<body data-page="{{page}}" data-role="{{role}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">F</span> Fork<span>line</span></a>
    <nav class="nav" aria-label="Main">{{nav}}</nav>
    <span class="account">{{account}}</span>
  </div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap footer-row">
    <p><strong>Forkline</strong> · Demo food delivery app for QA testing — no real orders or payments.</p>
    <p><a href="/help">Fees and rules</a></p>
  </div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
